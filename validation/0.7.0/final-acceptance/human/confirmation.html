<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0.7 人工确认表</title>
<style>
:root{color-scheme:light;--paper:#f7f9fc;--ink:#1c2b3a;--muted:#586a7b;--line:#d8e1ec;--accent:#1e507f;--green:#21644d;--amber:#865211}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "PingFang SC","Microsoft Yahei",sans-serif}main{max-width:1460px;margin:auto;padding:30px 28px 64px}header{display:flex;gap:24px;align-items:start;justify-content:space-between;margin-bottom:22px}h1{font-size:25px;margin:0;font-weight:600}p{margin:5px 0}.sub{color:var(--muted);font-size:13px}#summary{font-weight:600;color:var(--green)}#save-state{color:var(--muted);font-size:13px}table{border-collapse:collapse;width:100%;background:#fff;table-layout:fixed}th{text-align:left;font-size:13px;font-weight:600;background:#edf2f8;border-bottom:2px solid var(--line);padding:12px}td{vertical-align:top;padding:18px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th:first-child{width:90px}th:nth-child(2){width:39%}th:nth-child(3),th:nth-child(4){width:19%}th:last-child{width:17%}.title{font:18px/1.65 "Songti SC","SimSun",serif;margin:5px 0 9px}.row-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.body{white-space:pre-wrap;margin:8px 0;font-size:14px}.status{font-size:13px;color:var(--muted)}.risk{color:var(--amber)}.check{display:flex;align-items:center;gap:7px;min-height:44px;cursor:pointer}.check span{white-space:nowrap}.check input{width:21px;height:21px;accent-color:var(--green)}.check:has(input:disabled){color:var(--muted);cursor:default}ol{margin:5px 0;padding-left:21px}li{margin:3px 0}summary{cursor:pointer;color:var(--accent);font-size:13px}details{margin-top:10px}select,textarea{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff;padding:8px;font:inherit;color:var(--ink)}textarea{min-height:68px;margin-top:8px;resize:vertical}input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}tr.confirmed td:first-child{box-shadow:inset 4px 0 var(--green)}.counter{font-size:12px;color:var(--muted)}#error{color:#a42c36;white-space:pre-wrap}.empty{padding:24px;color:var(--muted)}.evidence{font-size:13px;margin-top:7px;white-space:pre-wrap}.changed{color:var(--amber);font-size:12px}
@media(max-width:820px){main{padding:18px 12px 40px}header{display:block}header>div:last-child{margin-top:12px}thead{display:none}table,tbody,tr,td{display:block;width:100%}tr{padding:10px 0;border-bottom:2px solid var(--line)}td{padding:9px 12px;border:0}td::before{content:attr(data-label);display:block;color:var(--muted);font-size:12px;margin-bottom:4px}td:first-child::before{display:none}.title{font-size:18px}tr.confirmed td:first-child{box-shadow:inset 4px 0 var(--green)}}
</style>
</head>
<body><main>
<header><div><h1>0.7 人工确认表</h1><p>阅读原标题，必要时展开正文；确认 AI 参考答案正确后勾选。</p><p class="sub" id="stage">正在读取样本…</p></div><div><div id="summary" aria-live="polite">已确认 0 条</div><div id="save-state" aria-live="polite">勾选和备注自动保存</div></div></header>
<p id="error" role="alert"></p>
<table aria-label="原始材料与姓名答案确认"><thead><tr><th>确认</th><th>原标题与正文</th><th>AI 参考答案</th><th>脚本结果</th><th>问题与备注</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">正在读取样本…</td></tr></tbody></table>
</main>
<script>
const table=document.getElementById('rows'), saved={}, controls=new Map();let dataset=null;const qaMode=new URLSearchParams(location.search).has('qa');
const node=(tag,text,className)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(className)e.className=className;return e};
const fingerprint=r=>JSON.stringify(r.ai?{names:r.ai.names,status:r.ai.status}:null);
function names(parent,list){if(!list.length){parent.append(node('div','无姓名'));return}const ol=node('ol');for(const name of list)ol.append(node('li',name));parent.append(ol);parent.append(node('div',`${list.length} 个标题姓名`, 'counter'))}
function recount(){let correct=0,reviewed=0;for(const r of dataset.records){const s=saved[r.row_id];if(s&&s.answer===fingerprint(r)&&['correct','incorrect','uncertain'].includes(s.verdict)){reviewed++;if(s.verdict==='correct')correct++}}document.getElementById('summary').textContent=`已确认正确 ${correct} / ${dataset.records.length} · 已检查 ${reviewed} 条`}
async function persist(r,verdict,note){const record={row_id:r.row_id,verdict,note,answer:fingerprint(r),script_version:dataset.script_version,reference_stage:dataset.reference_stage,review_method:'non_blind_confirmation',source:qaMode?'ui_test':'human_confirmation_ui'};document.getElementById('save-state').textContent='正在保存…';try{const response=await fetch('/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)});if(!response.ok)throw new Error('保存失败');saved[r.row_id]=record;document.getElementById('save-state').textContent='已自动保存';recount()}catch(e){document.getElementById('save-state').textContent='保存失败，请重新勾选';document.getElementById('error').textContent=e.message}}
function render(){table.replaceChildren();controls.clear();document.getElementById('stage').textContent=`${dataset.reference_stage} · 脚本 ${dataset.script_version} · 随机 ${dataset.random_count} 条，风险 ${dataset.risk_count} / 40 条${dataset.risk_count<40?'（待全量裁决后补齐）':''}。AI 尚未完成的条目暂不能确认。`;
for(const r of dataset.records){const tr=node('tr');const s=saved[r.row_id]||{};const current=s.answer===fingerprint(r);const checked=current&&s.verdict==='correct';if(checked)tr.classList.add('confirmed');const checkCell=node('td');checkCell.dataset.label='确认';const label=node('label',null,'check'),check=document.createElement('input');check.type='checkbox';check.checked=checked;check.disabled=!r.ai||!['names','no_name'].includes(r.ai.status);check.setAttribute('aria-label',`确认第${r.excel_row}行 AI 参考答案正确`);label.append(check,node('span','正确'));checkCell.append(label);tr.append(checkCell);
const source=node('td');source.dataset.label='原标题与正文';source.append(node('div',`原始第 ${r.excel_row} 行 · ${r.sample_kind} · ${r.fields['省']||''} ${r.fields['发文日期']||''}`,'row-meta'));source.append(node('div',r.fields['标题'],'title'));const body=node('details');body.append(node('summary','查看完整正文与对应批复'));body.append(node('div',`${r.fields['颁布机构']||''}\n${r.fields['文号']||''}\n被许可对象：${r.fields['被许可对象']||''}`,'row-meta'));body.append(node('div',r.fields['内容']||'原表未提供正文','body'));source.append(body);tr.append(source);
const ai=node('td');ai.dataset.label='AI 参考答案';if(!r.ai){ai.append(node('div','AI 审核中','status'))}else{names(ai,r.ai.names);const statusText={names:'确认有姓名',no_name:'确认无姓名',conflict:'证据冲突，待裁决',uncertain:'无法确定，待裁决'}[r.ai.status];ai.append(node('div',statusText,r.ai.status==='conflict'||r.ai.status==='uncertain'?'status risk':'status'));const evidence=node('details');evidence.append(node('summary','查看判断依据与原文引用'));evidence.append(node('div',r.ai.reason,'evidence'));for(const q of r.ai.body_evidence||[])evidence.append(node('div',`正文：${q}`,'evidence'));ai.append(evidence)}if(s.verdict&&s.verdict!=='pending'&&!current)ai.append(node('div','答案已更新，请重新确认','changed'));tr.append(ai);
const script=node('td');script.dataset.label='脚本结果';if(r.script.status==='uncertain'){script.append(node('div','空值 · 脚本未决','status risk'));if(r.script.names.length){script.append(node('div','未决候选（未写入正式输出）','counter'));names(script,r.script.names)}}else names(script,r.script.names);tr.append(script);
const feedback=node('td');feedback.dataset.label='问题与备注';const select=document.createElement('select');select.setAttribute('aria-label',`第${r.excel_row}行问题状态`);for(const [value,text] of [['pending','未确认'],['correct','已确认正确'],['incorrect','发现错误'],['uncertain','无法判断']]){const o=node('option',text);o.value=value;select.append(o)}select.value=current?s.verdict||'pending':'pending';select.disabled=!r.ai;const note=document.createElement('textarea');note.placeholder='有问题时简短记录原因';note.setAttribute('aria-label',`第${r.excel_row}行备注`);note.value=s.note||'';feedback.append(select,note);tr.append(feedback);table.append(tr);controls.set(r.row_id,{tr,check,select,note});
check.addEventListener('change',()=>{select.value=check.checked?'correct':'pending';tr.classList.toggle('confirmed',check.checked);persist(r,select.value,note.value)});select.addEventListener('change',()=>{if(select.value==='correct'&&check.disabled){select.value='pending';return}check.checked=select.value==='correct';tr.classList.toggle('confirmed',check.checked);persist(r,select.value,note.value)});note.addEventListener('change',()=>persist(r,select.value,note.value));}recount()}
async function load(initial=false){try{const response=await fetch('/confirmation-data.json',{cache:'no-store'});if(!response.ok)throw new Error('确认表暂不可读取');const data=await response.json();if(initial){const r=await fetch('/confirmations.json',{cache:'no-store'});if(r.ok)Object.assign(saved,await r.json())}const changed=!dataset||JSON.stringify(dataset.records)!==JSON.stringify(data.records);dataset=data;if(changed)render();else recount();document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}
load(true);setInterval(()=>{if(!table.contains(document.activeElement))load()},60000);
</script></body></html>
